name: Sync inventory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lucra-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Read public Drive and publish catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out catalogue
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install -r requirements.txt

      - name: Sync public Drive folder
        run: python sync_drive.py

      - name: Commit refreshed catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inventory.json data/inventory.js data/drive_overflow.json
          if git diff --cached --quiet; then
            echo "No catalogue changes to publish."
            exit 0
          fi
          git commit -m "Sync inventory from public Drive"
          git push
