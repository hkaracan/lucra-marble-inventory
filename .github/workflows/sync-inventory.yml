name: Sync inventory

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Europe/Istanbul'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lucra-pages-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Read public Drive and deploy catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out catalogue
        uses: actions/checkout@v6

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install -r requirements.txt

      - name: Capture previous catalogue baseline
        run: |
          if git cat-file -e HEAD:data/inventory.json 2>/dev/null; then
            git show HEAD:data/inventory.json > /tmp/lucra-previous-inventory.json
          fi

      - name: Sync public Drive folder
        id: sync
        run: |
          set -o pipefail
          python sync_drive.py 2>&1 | tee /tmp/lucra-sync.log

      - name: Validate catalogue before deployment
        run: python validate_catalogue.py --previous /tmp/lucra-previous-inventory.json

      - name: Add sync report to job summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("data/inventory.json").read_text(encoding="utf-8"))
          report = payload.get("report", {})
          lines = [
              "## Inventory sync report",
              f"- Bundles: {report.get('bundles', len(payload.get('products', [])))}",
              f"- Added: {report.get('added', 0)}",
              f"- Updated: {report.get('updated', 0)}",
              f"- Unchanged: {report.get('unchanged', 0)}",
              f"- Without packing lists: {report.get('missingPackingLists', 0)}",
              f"- Packing files without readable rows: {report.get('unreadablePackingLists', 0)}",
              f"- Without readable area: {report.get('missingAreas', 0)}",
              f"- Without readable dimensions: {report.get('missingDimensions', 0)}",
              f"- Without images: {report.get('missingImages', 0)}",
              f"- Photo-check issues: {report.get('photoCheckIssues', 0)}",
              f"- Photo-coverage notes: {report.get('photoCoverageNotes', 0)}",
              f"- Source-name/code mismatches: {report.get('sourceMismatches', 0)}",
              f"- Skipped optional photo folders: {report.get('skippedPhotoFolders', 0)}",
              f"- Folder errors: {report.get('folderErrors', len(payload.get('errors', [])))}",
          ]
          missing = report.get("missingPackingListFolders", [])
          if missing:
              lines.append("\n### Bundles without packing lists\n" + "\n".join(f"- {name}" for name in missing))
          warnings = payload.get("warnings", [])
          if warnings:
              lines.append("\n### Warnings\n" + "\n".join(f"- {item.get('folder', 'Unknown')}: {item.get('error', 'Unknown warning')}" for item in warnings[:25]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Explain failed sync
        if: failure()
        run: |
          {
            echo "## Inventory sync failed"
            echo "The previous catalogue remains deployed. No repository files were overwritten."
            if [ -s /tmp/lucra-sync.log ]; then
              echo ""
              echo "### Sync diagnostic"
              echo '```text'
              tail -n 30 /tmp/lucra-sync.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
