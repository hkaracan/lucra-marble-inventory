name: Sync inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: lucra-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Read public Drive and publish catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out catalogue
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install -r requirements.txt

      - name: Sync public Drive folder
        run: python sync_drive.py

      - name: Add sync report to job summary
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("data/inventory.json").read_text(encoding="utf-8"))
          report = payload.get("report", {})
          lines = [
              "## Inventory sync report",
              f"- Bundles: {report.get('bundles', len(payload.get('products', [])))}",
              f"- Added: {report.get('added', 0)}",
              f"- Updated: {report.get('updated', 0)}",
              f"- Unchanged: {report.get('unchanged', 0)}",
              f"- Without packing lists: {report.get('missingPackingLists', 0)}",
              f"- Packing files without readable rows: {report.get('unreadablePackingLists', 0)}",
              f"- Without readable area: {report.get('missingAreas', 0)}",
              f"- Without readable dimensions: {report.get('missingDimensions', 0)}",
              f"- Without images: {report.get('missingImages', 0)}",
              f"- Photo-check issues: {report.get('photoCheckIssues', 0)}",
              f"- Photo-coverage notes: {report.get('photoCoverageNotes', 0)}",
              f"- Source-name/code mismatches: {report.get('sourceMismatches', 0)}",
              f"- Skipped optional photo folders: {report.get('skippedPhotoFolders', 0)}",
              f"- Folder errors: {report.get('folderErrors', len(payload.get('errors', [])))}",
          ]
          missing = report.get("missingPackingListFolders", [])
          if missing:
              lines.append("\n### Bundles without packing lists\n" + "\n".join(f"- {name}" for name in missing))
          warnings = payload.get("warnings", [])
          if warnings:
              lines.append("\n### Warnings\n" + "\n".join(f"- {item.get('folder', 'Unknown')}: {item.get('error', 'Unknown warning')}" for item in warnings[:25]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Record failed sync status
        if: failure()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          workflow_url = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          failed_run = {
              "status": "failed",
              "attemptedAt": now,
              "syncedAt": None,
              "bundles": None,
              "added": None,
              "updated": None,
              "unchanged": None,
              "warnings": None,
              "errors": None,
              "addedFolders": [],
              "updatedFolders": [],
              "message": "The sync failed. The previous catalogue remains published.",
              "workflowUrl": workflow_url,
          }
          history_path = Path("data/sync_history.json")
          try:
              raw = json.loads(history_path.read_text(encoding="utf-8"))
              runs = raw.get("runs", []) if isinstance(raw, dict) else raw
          except (OSError, json.JSONDecodeError):
              runs = []
          runs = [failed_run] + [run for run in runs if isinstance(run, dict)]
          status = {
              "status": "failed",
              "attemptedAt": now,
              "syncedAt": None,
              "message": failed_run["message"],
              "workflowUrl": workflow_url,
              "run": failed_run,
          }
          for path, payload in ((history_path, {"runs": runs[:5]}), (Path("data/sync_status.json"), status)):
              temporary = path.with_suffix(f"{path.suffix}.tmp")
              temporary.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
              temporary.replace(path)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Inventory sync failed\nThe previous catalogue was kept. See the workflow run for details.\n")
          PY

      - name: Commit catalogue and sync status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inventory.json data/inventory.js data/drive_overflow.json data/sync_history.json data/sync_status.json
          if git diff --cached --quiet; then
            echo "No catalogue or sync-status changes to publish."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            git commit -m "Sync inventory from public Drive"
          else
            git commit -m "Record failed inventory sync"
          fi
          git push
